name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/perlbag/curriculum
  SERVICE: curriculum_web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push (stage prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_prod
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rolling deploy (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # sudo : root est authentifié sur GHCR (rôle registry) ; --with-registry-auth
            # propage SES credentials aux agents Swarm pour pull l'image privée.
            sudo docker service update --with-registry-auth \
              --image ${{ env.IMAGE }}:${{ github.sha }} ${{ env.SERVICE }}
